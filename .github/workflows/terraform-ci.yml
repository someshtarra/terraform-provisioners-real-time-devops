name: "Terraform Production CI/CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read
  pull-requests: write

jobs:
  validate_and_plan:
    name: "Terraform Lint, Security Scan & Plan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: "Terraform Format Check"
        id: fmt
        run: terraform fmt -check -recursive

      - name: "Terraform Init"
        id: init
        run: terraform init -backend=false

      - name: "Terraform Validate"
        id: validate
        run: terraform validate

      - name: "Run Security Scan (Trivy / Checkov)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "0" # Audit mode for demo

      # In real production with OIDC:
      # - name: "Configure AWS Credentials via OIDC"
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsTerraformRole
      #     aws-region: us-east-1

      - name: "Terraform Plan"
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          terraform plan -no-color -out=tfplan || true

  apply_production:
    name: "Terraform Apply (Production)"
    runs-on: ubuntu-latest
    needs: [validate_and_plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      # - name: "Configure AWS Credentials via OIDC"
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsTerraformRole
      #     aws-region: us-east-1

      - name: "Terraform Init"
        run: terraform init

      - name: "Terraform Apply"
        run: |
          # In CI runners using provisioners, SSH keys or Bastion agents must be configured
          # In user-data / immutable AMI mode, apply runs cleanly through AWS APIs only!
          terraform apply -auto-approve

      - name: "Post-Deployment Verification"
        run: |
          chmod +x scripts/deploy_verification.sh
          ./scripts/deploy_verification.sh || true
